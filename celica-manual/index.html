<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>ST185 Celica GT-Four / All-Trac — Repair Manual</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .b-3sgte{background:#3a1416;color:#ff9a9e;border-color:#5a1f22}
  .b-5sfe{background:#20262e;color:#9fb0c0}
  .b-both{background:#2a1c3a;color:var(--purple);border-color:#43305f}
  .b-3sge{background:#3a2a14;color:#f0c674;border-color:#5a431c}
  .b-4afe{background:#142e2a;color:#8fd6c8;border-color:#1f4a42}
  .b-tq{background:#12251a;color:#7ee2a8;border-color:#1f4630}
  .b-ewd{background:#2b2410;color:var(--amber);border-color:#4a3d16}
  .b-book{background:#14233a;color:#8fbfff;border-color:#25406a}
  .tqsrc{margin-bottom:11px}
  .tqsrc:last-child{margin-bottom:0}
  .tqsrc-name{display:block;font-size:12.5px;color:var(--txt);margin-bottom:7px}
  .tqsrc-name b{color:var(--accent2)}
  .tqsrc-name .kind{color:var(--muted);font-size:11px}
  .tqgrid{display:flex;flex-wrap:wrap;gap:8px}
  .tqcard{width:104px;background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;
    cursor:pointer;transition:border-color .12s,transform .12s}
  .tqcard:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .tqcard img{width:100%;aspect-ratio:17/22;object-fit:cover;object-position:top center;display:block;background:#fff}
  .tqcard .cap{display:block;text-align:center;font-family:var(--mono);font-size:11px;
    background:var(--panel2);color:var(--accent2);padding:3px 0;border-top:1px solid var(--line)}
  .sec-link{cursor:pointer;color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>🔧 ST185 Celica <span class="car">GT-Four / All-Trac</span> — Repair Manual</h1>
    <span class="stats" id="stats"></span>
  </div>
  <div class="toolbar">
    <input id="q" placeholder="Search procedures, parts, specs…  (press /)">
    <select id="fengine">
      <option value="">All engines</option>
      <option value="3sgte">3S-GTE (turbo)</option>
      <option value="5sfe">5S-FE</option>
      <option value="both">Shared</option>
      <option value="na">Non-engine</option>
    </select>
    <button class="tglbtn" id="fcar" title="Show only sections that fit the car picked in this tab">Pick a car</button>
  </div>
</header>
<div id="protowarn">⚠ Opened as a plain file — the in-app PDF viewer needs the local server.
  Run <b>CelicaManual.exe</b> instead.</div>
<main>
  <nav class="rail" id="rail"></nav>
  <section class="content" id="content"></section>
</main>
<div id="pv"><img alt=""><span class="cap"></span></div>

<script src="../shared/search.js"></script>
<script src="../shared/preview.js"></script>
<script src="../shared/pdfnav.js"></script>
<script src="../shared/memory.js"></script>
<script src="../shared/garage.js"></script>
<script src="../shared/bridge.js"></script>
<script src="../shared/addmanuals.js"></script>
<script src="data/data.js"></script>
<script src="../electrical/data/repair_links.js" onerror="window.EWD_LINKS={}"></script>
<script>
"use strict";
const D = window.CELICA_DATA || {records:[],page_index:{}};
const RECS = D.records;
const BY_ID = {};
RECS.forEach(r=>{
  BY_ID[r.id]=r;
  r.torque_table_pages=r.torque_table_pages||[];
  r.master_torque=r.master_torque||[];
  r._titleBlob=(r.title+" "+r.heading+" "+r.code+" "+r.system+" "+r.group).toLowerCase();
  r._blob=(r._titleBlob+" "+r.text).toLowerCase();
});
const TQ_TABLES = RECS.filter(r=>r.torque_table_pages.length).length;

const GROUP_ORDER = ["Engine","Engine Electrical","Drivetrain","Chassis","Brakes",
  "Electrical","HVAC","Body","General","Other"];
const ENG_BADGE = {"3sgte":["3S-GTE","b-3sgte"],"5sfe":["5S-FE","b-5sfe"],
  "both":["3S+5S","b-both"],"3sge":["3S-GE","b-3sge"],"4afe":["4A-FE","b-4afe"],"na":["",""]};
const APP = "repair";

const state = {group:"All", q: Memory.flag(APP, "q", ""), engine: Memory.flag(APP, "engine", ""),
  carOnly: Memory.flag(APP, "carOnly", "0") === "1", view:"grid", sel:null, page:null,
  infoOpen: Memory.flag(APP, "infoOpen", "1") === "1"};

document.getElementById("stats").textContent =
  RECS.length+" sections · "+TQ_TABLES+" torque tables · "+
  Object.keys(D.page_index).length+" indexed pages";
if(location.protocol==="file:") document.getElementById("protowarn").style.display="block";

// ---------- helpers ----------
function esc(s){return Lib.esc(s);}
function terms(){return Lib.terms(state.q);}
function matchGroup(r){return state.group==="All" || r.group===state.group;}
function carNow(){return state.carOnly ? Garage.selected(APP) : null;}
function matchFilters(r){
  if(!matchGroup(r)) return false;
  if(state.engine && r.engine!==state.engine) return false;
  if(carNow() && !Garage.repairFits(r, RECS, carNow())) return false;
  return terms().every(w=>r._blob.includes(w));
}
// rank 0 = every search term found in title/header; rank 1 = body-only match
function rankOf(r){
  const t=terms(); if(!t.length) return 0;
  return t.every(w=>r._titleBlob.includes(w)) ? 0 : 1;
}
function hi(text){return Lib.hi(text, terms());}
function hitFor(r){return Lib.findHit(r.text, terms());}
function thumbHref(r){return "thumbs/"+encodeURIComponent(r.thumb);}
function pageThumb(id,page){return "thumbs/pages/"+encodeURIComponent(id)+"_p"+page+".png";}
// PDF.js viewer URL — renders the PDF in-app (no browser plugin, no download)
function viewerSrc(r,page){
  const abs=new URL("../manuals/"+encodeURIComponent(r.file),location.href).href;
  return "../shared/pdfjs/web/viewer.html?file="+encodeURIComponent(abs)+
         (page?("#page="+page+"&zoom=page-width"):"#zoom=page-width");
}
function openSection(id,page){
  if(!BY_ID[id]) return;
  state.sel=id; state.view="detail"; state.page=page||null;
  Lib.hidePreview();
  Memory.pushRecent(APP, {id:id, title:BY_ID[id].title, page:page||null});
  render();
}

// ---------- left rail ----------
function buildRail(){
  const counts={}; RECS.forEach(r=>counts[r.group]=(counts[r.group]||0)+1);
  const rail=document.getElementById("rail");
  let h='<div class="railsec">Browse</div>';
  h+=railBtn("All","Systems",RECS.length);
  GROUP_ORDER.filter(g=>counts[g]).forEach(g=>{ h+=railBtn(g,g,counts[g]); });
  h+='<div class="railsec">Tools</div>';
  h+='<button class="railbtn" data-view="torque"><span>⚙ Torque tables</span>'+
     '<span class="cnt">'+TQ_TABLES+'</span></button>';
  h+='<button class="railbtn" data-view="garage"><span>🚗 Garage</span>'+
     '<span class="cnt">'+Garage.cars().length+'</span></button>';
  h+=placeRail("pins", "Pinned", Memory.pins(APP));
  h+=placeRail("recent", "Recent", Memory.recent(APP));
  h+='<button class="railbtn" data-view="add"><span>+ Add manuals</span></button>';
  rail.innerHTML=h;
  rail.querySelectorAll("[data-group]").forEach(b=>b.onclick=()=>{
    state.group=b.dataset.group; state.view="grid"; state.sel=null; render();
  });
  rail.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();});
  rail.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    openSection(b.dataset.open, b.dataset.page?parseInt(b.dataset.page,10):null);
  });
}
function placeRail(view, label, items){
  let h='<button class="railbtn" data-view="'+view+'"><span>'+label+'</span>'+
    '<span class="cnt">'+items.length+'</span></button>';
  items.slice(0, 5).forEach(item=>{
    if(!BY_ID[item.id]) return;
    h+='<button class="railbtn" data-open="'+esc(item.id)+'" data-page="'+(item.page||'')+'">'+
      '<span>'+esc(item.title)+(item.page?' p.'+item.page:'')+'</span></button>';
  });
  return h;
}
function railBtn(group,label,count){
  return '<button class="railbtn" data-group="'+esc(group)+'"><span>'+esc(label)+
    '</span><span class="cnt">'+count+'</span></button>';
}
function syncRail(){
  document.querySelectorAll(".rail .railbtn").forEach(b=>{
    const tools = state.view==="torque" || state.view==="add" || state.view==="garage" ||
      state.view==="pins" || state.view==="recent";
    const on = (!tools && b.dataset.group===state.group) ||
               (b.dataset.view && b.dataset.view===state.view);
    b.classList.toggle("active",!!on);
  });
}

// ---------- render ----------
function render(){
  syncRail(); Lib.hidePreview(); syncCarButton();
  const c=document.getElementById("content");
  if(state.view==="torque"){ c.innerHTML=gridHTML(true); wireGrid(c); remember(); return; }
  if(state.view==="add"){ c.innerHTML=ADDP.html(); ADDP.wire(c); return; }
  if(state.view==="garage"){ c.innerHTML=Garage.panelHTML(APP); Garage.wire(c, APP, (action)=>{
    if(action==="use" || action==="save") state.carOnly=!!Garage.selected(APP);
    if(!Garage.selected(APP)) state.carOnly=false;
    Memory.setFlag(APP, "carOnly", state.carOnly ? "1" : "0");
    if(action==="use" || action==="save") state.view="grid";
    render();
  }); return; }
  if(state.view==="pins" || state.view==="recent"){ c.innerHTML=placeHTML(state.view); wireGrid(c); remember(); return; }
  if(state.view==="detail" && BY_ID[state.sel]){
    const p=state.page; state.page=p||null;
    c.innerHTML=detailHTML(BY_ID[state.sel],p); wireDetail(c, p); remember(); return;
  }
  state.view="grid";
  c.innerHTML=gridHTML(false); wireGrid(c); remember();
}
function remember(){
  Memory.savePlace(APP, {view:state.view, sel:state.sel, page:state.page, group:state.group,
    q:state.q, engine:state.engine});
}
function syncCarButton(){
  const btn=document.getElementById("fcar");
  const car=Garage.selected(APP);
  if(!car && state.carOnly){ state.carOnly=false; Memory.setFlag(APP, "carOnly", "0"); }
  btn.textContent = car ? Garage.label(car) : "Pick a car";
  btn.classList.toggle("on", !!(state.carOnly && car));
  btn.title = car
    ? "This tab only. Show sections that fit "+Garage.label(car)+". The electrical tab keeps its own car."
    : "Save a car in the garage, then this tab can filter to it.";
}
function placeHTML(kind){
  const items = kind==="pins" ? Memory.pins(APP) : Memory.recent(APP);
  const title = kind==="pins" ? "Pinned pages" : "Recently opened";
  const head='<div class="cbar"><span class="ttl">'+title+'</span><span class="sub">'+
    items.length+" in this tab"+'</span></div>';
  if(!items.length) return head+'<div class="empty">Nothing here yet. Open a section, or pin it from the page.</div>';
  const cards=items.filter(item=>BY_ID[item.id]).map(item=>{
    const r=BY_ID[item.id];
    return '<div class="gcard" data-id="'+esc(r.id)+'" data-page="'+(item.page||'')+'">'+
      '<div class="gmeta"><div class="gtitle">'+esc(r.title)+'</div>'+
      '<div class="gsub">'+(item.page?'Page '+item.page:'Start of section')+'</div></div></div>';
  }).join("");
  return head+'<div class="gridwrap"><div class="grid">'+cards+'</div></div>';
}

// ---------- grid ----------
function gridHTML(torqueOnly){
  let list=RECS.filter(matchFilters);
  if(torqueOnly) list=list.filter(r=>r.torque_table_pages.length);
  const searching=terms().length>0;
  list.sort((a,b)=>{
    const ra=rankOf(a), rb=rankOf(b);
    if(ra!==rb) return ra-rb;
    if(a.relevance!==b.relevance) return a.relevance==="car"?-1:1;
    return a.title.localeCompare(b.title);
  });
  const title=torqueOnly?"Torque tables":(state.group==="All"?"All systems":state.group);
  const sub=list.length+" section"+(list.length!==1?"s":"")+
    (torqueOnly?" with a factory torque table":"")+
    (state.q?' matching “'+esc(state.q)+'” — title/header matches first':'')+
    (torqueOnly?" — opens the PDF at the table page":"");
  const head='<div class="cbar"><span class="ttl">'+esc(title)+'</span><span class="sub">'+sub+'</span></div>';
  if(!list.length) return head+'<div class="empty">No sections match. Try clearing the search or the car filter.</div>';
  let cards=""; let lastRank=-1;
  list.forEach(r=>{
    const rk=rankOf(r);
    if(searching && rk!==lastRank){
      cards+='<div class="divider">'+(rk===0?"Title / header matches":"Content matches")+'</div>';
      lastRank=rk;
    }
    const eb=ENG_BADGE[r.engine]||["",""];
    const hit=searching?hitFor(r):null;
    const jp=torqueOnly?r.torque_table_pages[0]:(hit&&hit.page?hit.page:"");
    const badges='<div class="bstack">'+
      (eb[0]?'<span class="badge '+eb[1]+'">'+eb[0]+'</span>':'')+
      (r.relevance==="ref"?'<span class="badge b-ref">REF</span>':'')+
      ((window.EWD_LINKS||{})[r.id]?'<span class="badge b-ewd" title="Has wiring diagrams in the Electrical app">⚡ WIRING</span>':'')+
      (r.book?'<span class="badge b-book" title="Imported from '+esc(r.book)+'">'+esc(r.book.replace(" (aftermarket)",""))+'</span>':'')+
      (r.torque_table_pages.length?'<span class="badge b-tq">TORQUE TABLE</span>':
        (r.image_only?'<span class="badge b-img">DIAGRAM</span>':''))+'</div>';
    const sub=torqueOnly
      ? 'Table p.'+r.torque_table_pages.join(', p.')
      : esc(r.system)+(r.code?' · '+esc(r.code):'')+' · '+r.pages+'p';
    cards+='<div class="gcard" data-id="'+esc(r.id)+'" data-page="'+jp+'">'+
      '<div class="gthumb"><img loading="lazy" src="'+thumbHref(r)+'" alt="'+esc(r.title)+'" '+
        'onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'beforeend\',\'<div class=ph>No preview</div>\')">'+
        badges+'</div>'+
      '<div class="gmeta"><div class="gtitle">'+hi(r.title)+'</div>'+
        '<div class="gsub">'+sub+'</div>'+
        (hit&&hit.snippet?'<div class="gsnip">'+hit.snippet+'</div>':'')+
      '</div></div>';
  });
  return head+'<div class="gridwrap"><div class="grid">'+cards+'</div></div>';
}
function wireGrid(c){
  c.querySelectorAll(".gcard").forEach(el=>el.onclick=()=>{
    const pg=el.dataset.page?parseInt(el.dataset.page,10):null;
    openSection(el.dataset.id,pg);
  });
}

// ---------- detail ----------
function tqSource(rr,kind){
  let h='<div class="tqsrc"><span class="tqsrc-name"><b>Torque ref</b> — '+esc(rr.title)+
    ' <span class="kind">('+kind+')</span></span><div class="tqgrid">';
  rr.torque_table_pages.forEach(p=>{
    h+='<div class="tqcard" data-open="'+esc(rr.id)+'" data-page="'+p+'">'+
      '<img loading="lazy" src="'+pageThumb(rr.id,p)+'" alt="torque table page '+p+'" '+
      'onerror="this.style.display=\'none\'">'+
      '<span class="cap">p.'+p+'</span></div>';
  });
  return h+'</div></div>';
}
function detailHTML(r,jumpPage){
  const eb=ENG_BADGE[r.engine]||["",""];

  // jump links — named per linked section, hover shows target-page image
  let refs="";
  if(r.refs_resolved && r.refs_resolved.length){
    refs='<div class="card"><h3>Jump links — related sections</h3><div class="inner">'+
      '<p class="hint">Hover to preview the target page; click to open it in the viewer.</p>'+
      '<div class="reflist">';
    r.refs_resolved.forEach(x=>{
      if(x.target && BY_ID[x.target]){
        const t=BY_ID[x.target];
        const code=(x.approx?"~":"")+x.code;
        refs+='<span class="refbtn'+(x.approx?' approx':'')+'" data-open="'+esc(x.target)+'" data-page="'+(x.page||'')+'"'+
          (x.approx?' title="nearest page — exact page not in this set"':'')+
          (x.page?' data-pv="'+pageThumb(x.target,x.page)+'" data-pvcap="'+esc(t.title)+' — p.'+x.page+' ('+esc(code)+')"':'')+
          '>'+esc(t.title)+'<span class="pg">'+esc(code)+'</span></span>';
      } else {
        const sys=x.system||"";
        const pfx=x.code.split("-")[0];
        refs+='<span class="refbtn dead" title="This page is not included in your PDF set'+
          (sys?' ('+esc(pfx)+' = '+esc(sys)+')':'')+'">'+esc(x.code)+
          (sys?'<span class="pg">· '+esc(sys)+'</span>':'')+'</span>';
      }
    });
    refs+='</div></div></div>';
  }

  // torque tables — ONLY factory torque-table pages, with page preview images
  const shown={}; shown[r.id]=1;
  let srcs="";
  if(r.torque_table_pages.length) srcs+=tqSource(r,"this section");
  r.master_torque.forEach(m=>{
    if(shown[m.target]||!BY_ID[m.target])return; shown[m.target]=1;
    srcs+=tqSource(BY_ID[m.target],"master torque table");
  });
  (r.refs_resolved||[]).forEach(x=>{
    const t=x.target;
    if(t && !shown[t] && BY_ID[t] && BY_ID[t].torque_table_pages.length){
      shown[t]=1; srcs+=tqSource(BY_ID[t],"related section");
    }
  });
  let tq='<div class="card"><h3>Torque tables</h3><div class="inner">';
  tq+=srcs
    ? '<p class="hint">Factory torque-specification tables for this section. Click a page image to open it in the viewer.</p>'+srcs
    : '<p class="note">No factory torque table is associated with this section.</p>';
  tq+='</div></div>';

  const wiring=(window.EWD_LINKS||{})[r.id]||[];
  const ewd=wiring.length?'<div class="card"><h3>Wiring diagrams</h3><div class="inner">'+
    '<p class="hint">Circuits for this system in the Electrical app — opens the edition that matches your car.</p>'+
    '<div class="reflist">'+wiring.map(w=>'<span class="refbtn" data-ewd="'+esc(w.system)+'">⚡ '+esc(w.name)+'</span>').join("")+
    '</div></div></div>':'';

  return ''+
      '<div class="detail'+(state.infoOpen?'':' fold')+'">'+
      '<div class="dtop"><div class="row1">'+
        '<button class="btn ghost" id="back">← Sections</button>'+
        '<h2>'+esc(r.title)+'</h2>'+
        '<button class="btn ghost" id="pin">'+(Memory.isPinned(APP, r.id, jumpPage)?'Unpin':'Pin')+'</button>'+
        '<button class="btn ghost" id="fold">'+(state.infoOpen?'Hide details':'Show details')+'</button>'+
        '<a class="btn" href="'+viewerSrc(r,jumpPage)+'" target="_blank" rel="noopener">Open in new tab ↗</a>'+
      '</div>'+
      '<div class="dmeta">'+
        '<span class="badge b-code">'+esc(r.system)+(r.code?' · '+esc(r.code):'')+'</span>'+
        (eb[0]?'<span class="badge '+eb[1]+'">'+eb[0]+'</span>':'')+
        (r.engine==="5sfe"?'<span class="badge b-ref">5S-FE reference</span>':'')+
        (r.engine==="3sge"?'<span class="badge b-3sge">3S-GE</span>':'')+
        (r.engine==="4afe"?'<span class="badge b-4afe">4A-FE</span>':'')+
        (r.book?'<span class="badge b-book">From '+esc(r.book)+'</span>':'')+
        '<span>'+r.pages+' pages</span><span style="color:#63707d">'+esc(r.file)+'</span>'+
      '</div>'+fitNote(r)+'</div>'+
      '<div class="dsplit">'+
        '<div class="pdfpane"><iframe id="viewer" src="'+viewerSrc(r,jumpPage)+'" title="'+esc(r.title)+' PDF"></iframe></div>'+
        '<div class="infopane">'+ewd+tq+refs+'</div>'+
      '</div>'+
    '</div>';
}
function fitNote(r){
  const car=Garage.selected(APP);
  if(!car) return "";
  const why=Garage.repairWhy(r, RECS, car);
  if(!why.length) return '<div class="fitnote ok">Fits '+esc(Garage.label(car))+' in this tab.</div>';
  return '<div class="fitnote no">Kept visible because you opened it. It is outside '+esc(Garage.label(car))+
    ': '+esc(why.join(", "))+'. </div>';
}
function wireDetail(c, jumpPage){
  c.querySelector("#back").onclick=()=>{state.view="grid";state.sel=null;render();};
  c.querySelector("#pin").onclick=()=>{
    const r=BY_ID[state.sel];
    const on=Memory.togglePin(APP, {id:r.id, title:r.title, page:jumpPage||null});
    c.querySelector("#pin").textContent=on?"Unpin":"Pin";
    buildRail();
    syncRail();
  };
  c.querySelector("#fold").onclick=()=>{
    state.infoOpen=!state.infoOpen;
    Memory.setFlag(APP, "infoOpen", state.infoOpen?"1":"0");
    c.querySelector(".detail").classList.toggle("fold", !state.infoOpen);
    c.querySelector("#fold").textContent=state.infoOpen?"Hide details":"Show details";
  };
  c.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{
    const pg=el.dataset.page?parseInt(el.dataset.page,10):null;
    openSection(el.dataset.open,pg);
  });
  c.querySelectorAll("[data-ewd]").forEach(el=>el.onclick=()=>Shell.open("electrical","sys:"+el.dataset.ewd));
  Lib.bindPreviews(c);
}

// ---------- add manuals ----------
const ADDP = AddManuals.create({
  app: "repair",
  files: () => RECS,
  overlapNoun: "page codes",
  checkHint: "Uploads are checked against your library first: same filename or overlapping "+
    "Toyota page codes trigger a comparison so you never silently lose a more complete section.",
  rebuildHint: "Rebuilding re-scans every PDF. A normal rebuild takes about 10–30 seconds. "+
    "The first time a scanned picture PDF is added, reading the pictures takes longer. "+
    "New sections get search, thumbnails, torque-table links and cross-references.",
});

// ---------- events ----------
let deb;
document.getElementById("q").addEventListener("input",e=>{
  clearTimeout(deb); deb=setTimeout(()=>{
    state.q=e.target.value.trim();
    Memory.setFlag(APP, "q", state.q);
    if(state.view==="detail") state.view="grid";
    render();
  },130);
});
document.getElementById("fengine").value=state.engine;
document.getElementById("q").value=state.q;
document.getElementById("fengine").onchange=e=>{
  state.engine=e.target.value; Memory.setFlag(APP, "engine", state.engine);
  if(state.view==="detail")state.view="grid"; render();};
document.getElementById("fcar").onclick=()=>{
  if(!Garage.selected(APP)){ state.view="garage"; render(); return; }
  state.carOnly=!state.carOnly;
  Memory.setFlag(APP, "carOnly", state.carOnly?"1":"0");
  if(state.view==="detail") state.view="grid";
  render();
};
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement.id!=="q"){e.preventDefault();document.getElementById("q").focus();}
  if(e.key==="Escape"&&state.view==="detail"){state.view="grid";state.sel=null;render();}
});

buildRail();
(function restore(){
  if(/open=/.test(location.hash)) return;
  const place=Memory.place(APP);
  if(!place || place.view==="add") return;
  if(place.group) state.group=place.group;
  if(place.view==="detail" && BY_ID[place.sel]){
    state.view="detail"; state.sel=place.sel; state.page=place.page||null;
  } else if(place.view) state.view=place.view;
})();
render();
Shell.onOpen((id,page)=>openSection(id,page));
window.addEventListener("storage", e=>{
  if(!e.key || e.key.indexOf("celica.")!==0) return;
  if(e.key==="celica.electrical.carId" || e.key==="celica.electrical.carOnly") return;
  if(state.view==="garage" || state.view==="add") return;
  render();
});
</script>
</body>
</html>
