<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>ST185 Celica — Electrical Wiring Diagrams</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .brand .car{color:var(--amber)}
  .railbtn.active{box-shadow:inset 3px 0 0 var(--amber)}
  .tglbtn.on{background:var(--accent2);border-color:var(--accent2);color:#06120a}
  .gcard:hover{border-color:var(--amber)}
  .b-fit{background:#12251a;color:#7ee2a8;border-color:#1f4630}
  .b-var{background:#2a1c3a;color:var(--purple);border-color:#43305f}
  .b-yr{background:var(--chip);color:var(--muted)}
  .b-push{background:#14233a;color:#8fbfff;border-color:#25406a}
  .b-dial{background:#2b2410;color:var(--amber);border-color:#4a3d16}
  .b-warn{background:#3a1416;color:#ff9a9e;border-color:#5a1f22}
  .gyears{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chips .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--txt);font-size:12px;
    padding:4px 9px;border-radius:14px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--amber)}
  .chip.on{background:#3a2e0e;border-color:var(--amber);color:#ffe08a}
  .chip.off{opacity:.45;cursor:default}
  .chip .yr{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
  .drow{display:flex;gap:16px;flex-wrap:wrap;margin-top:7px}
  .fitnote{font-size:12px;margin-top:6px}
  .fitnote.ok{color:var(--accent2)} .fitnote.no{color:#ff9a9e}
  .feat{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-bottom:1px solid var(--line);
    cursor:pointer;font-size:12.5px}
  .feat:last-child{border-bottom:none}
  .feat:hover{background:var(--panel2)}
  .feat .n{font-family:var(--mono);color:var(--amber);min-width:18px}
  .feat .t{flex:1}
  .feat .pg{font-family:var(--mono);color:var(--muted);font-size:11px;white-space:nowrap}
  .feat.dim{opacity:.45}
  .ctable{width:100%;border-collapse:collapse;font-size:12px}
  .ctable td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .ctable tr:last-child td{border-bottom:none}
  .ctable .code{font-family:var(--mono);color:var(--amber);white-space:nowrap;width:44px}
  .ctable .where{white-space:nowrap;text-align:right}
  .loclink{font-family:var(--mono);font-size:11px;color:var(--blue);cursor:pointer;margin-left:4px}
  .loclink:hover{text-decoration:underline}
  .mini{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:6px 9px;border-radius:7px;font-size:12px;margin-bottom:8px}
  .mini:focus{outline:none;border-color:var(--amber)}
  .matrix{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  .matrix th,.matrix td{border:1px solid var(--line);padding:5px 6px;text-align:center}
  .matrix th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:11px}
  .matrix td.hit{cursor:pointer;color:var(--accent2)}
  .matrix td.hit:hover{background:#12251a}
  .matrix td.cur{background:#3a2e0e;color:#ffe08a}
  .matrix td.miss{color:#55606c}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 8px 8px 0}
  .seg button{background:var(--panel2);border:none;color:var(--muted);padding:6px 11px;font-size:12px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:#3a2e0e;color:#ffe08a}
  .seg button:disabled{opacity:.4;cursor:default}
  .banner{background:#1d1810;border:1px solid #5a451c;border-radius:10px;padding:10px 13px;margin:0 0 14px;
    display:flex;gap:12px;align-items:center;font-size:13px}
  .banner .btn{margin-left:auto}
  .locstrip{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .locstrip .lh{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
  .lochit{display:inline-flex;gap:6px;align-items:center;background:var(--chip);border:1px solid var(--line);
    border-radius:6px;padding:4px 8px;margin:0 6px 6px 0;font-size:12px;cursor:pointer}
  .lochit:hover{border-color:var(--amber)}
  .lochit .code{font-family:var(--mono);color:var(--amber)}
  .lochit .src{font-family:var(--mono);color:var(--muted);font-size:10.5px}
  .formgrid{display:grid;grid-template-columns:170px 1fr;gap:9px 14px;align-items:center;font-size:13px}
  .formgrid label{color:var(--muted)}
  .formgrid select{width:100%}
  .loctable{width:100%;border-collapse:collapse;font-size:12.5px}
  .loctable th{position:sticky;top:0;background:var(--panel2);text-align:left;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:7px 8px;border-bottom:1px solid var(--line)}
  .loctable td{padding:6px 8px;border-bottom:1px solid var(--line)}
  .loctable tr.click{cursor:pointer}
  .loctable tr.click:hover td{background:var(--panel2)}
  .loctable .code{font-family:var(--mono);color:var(--amber);white-space:nowrap}
  .loctoolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .loctoolbar input{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:8px 10px;border-radius:8px;font-size:13px}
  .xlink{display:block;padding:5px 2px;font-size:12.5px;cursor:pointer;color:var(--blue)}
  .xlink:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>⚡ ST185 Celica <span class="car">Electrical</span> — Wiring Diagrams</h1>
    <span class="stats" id="stats"></span>
  </div>
  <div class="toolbar">
    <input id="q" placeholder="Search systems, components (A34), connectors (IE1), fuses (HAZ-HORN)…  (press /)">
    <select id="fed" title="Limit to one wiring-diagram edition"></select>
    <button class="tglbtn" id="fcar" title="Show only circuits that apply to your car">My car</button>
  </div>
</header>
<div id="protowarn">⚠ Opened as a plain file — the in-app PDF viewer needs the local server.
  Run <b>CelicaManual.exe</b> instead.</div>
<main>
  <nav class="rail" id="rail"></nav>
  <section class="content" id="content"></section>
</main>
<div id="pv"><img alt=""><span class="cap"></span></div>

<script src="../shared/bridge.js"></script>
<script src="../shared/addmanuals.js"></script>
<script src="data/data.js"></script>
<script>
"use strict";
const D = window.EWD_DATA || {sources:[],categories:[],systems:[],circuits:[],locations:[]};
const CIRC = D.circuits, BY_ID = {}, SYS = {}, SRC = {};
D.sources.forEach(s=>SRC[s.id]=s);
D.systems.forEach(s=>SYS[s.key]=s);
CIRC.forEach(c=>{
  BY_ID[c.id]=c;
  const comp=c.components.map(x=>x.code+" "+x.name).join(" ");
  const misc=[].concat(c.joints,c.junction_blocks,c.relay_blocks).map(x=>x.code+" "+x.name).join(" ");
  c._titleBlob=(c.name+" "+c.title+" "+c.variant+" "+c.features.map(f=>f.title).join(" ")).toLowerCase();
  c._blob=(c._titleBlob+" "+comp+" "+misc+" "+c.fuses.join(" ")+" "+c.options.join(" ")+" "+c.text).toLowerCase();
});
const CAT_NAME = {}; D.categories.forEach(c=>CAT_NAME[c.key]=c.name);

// ---------- My car profile ----------
const MODELS = {
  ST185:{label:"ST185 GT-Four / All-Trac (3S-GTE turbo)", engine:"3S-GTE", drive:"ALL-TRAC/4WD"},
  ST184:{label:"ST184 GT / GT-S (5S-FE)", engine:"5S-FE", drive:"2WD"},
  AT180:{label:"AT180 ST (4A-FE)", engine:"4A-FE", drive:"2WD"},
};
// The owner's car: 1993 ST185, automatic A/C with the dial blower control.
const PROFILE_DEFAULT = {year:1993, model:"ST185", trans:"M/T", body:"LIFTBACK", market:"USA",
  ac:"auto", blower:"dial", cd:"", power_seat:"", sunroof:"", cruise:"", abs:"", configured:true};
function loadProfile(){
  try{ return Object.assign({}, PROFILE_DEFAULT, JSON.parse(localStorage.getItem("ewd.profile")||"{}")); }
  catch(e){ return Object.assign({}, PROFILE_DEFAULT); }
}
let PROFILE = loadProfile();
function saveProfile(){ try{ localStorage.setItem("ewd.profile", JSON.stringify(PROFILE)); }catch(e){} }
function suggestedBlower(year){ return year<=1991 ? "push" : year>=1993 ? "dial" : ""; }
function profBlower(){ return PROFILE.blower || suggestedBlower(PROFILE.year); }

// Does circuit c apply to the profile? Returns [] when it fits, else reasons.
function misfit(c, p){
  p = p || PROFILE;
  const a = c.applies||{}, m = MODELS[p.model]||MODELS.ST185, why=[];
  if(a.engines && a.engines.length && !a.engines.includes(m.engine)) why.push(a.engines.join("/")+" engine");
  if(a.drive && !a.drive.includes(m.drive)) why.push(a.drive.join("/").toLowerCase().replace("all-trac","All-Trac"));
  if(a.market && p.market && !a.market.includes(p.market)) why.push(a.market.join("/")+" market");
  if(a.trans && p.trans && !a.trans.includes(p.trans)) why.push(a.trans.join("/")+" only");
  if(a.body && p.body && !a.body.includes(p.body)) why.push(a.body.join("/").toLowerCase()+" only");
  const ac = {auto:"AUTO", manual:"MANUAL", none:"NONE"}[p.ac];
  if(a.ac && ac && !a.ac.includes(ac)) why.push({AUTO:"automatic A/C",MANUAL:"manual A/C",NONE:"no A/C"}[a.ac[0]]);
  const bl = profBlower();
  if(a.blower && a.blower.length && bl && !a.blower.includes(bl.toUpperCase()))
    why.push(a.blower.map(b=>b==="PUSH"?"push-button":"dial").join("/")+" blower control");
  if(a.cd!==undefined && p.cd && a.cd!==(p.cd==="yes")) why.push(a.cd?"with CD player":"without CD player");
  if(c.option && p[c.option]==="no") why.push("option not fitted");
  return why;
}
function fits(c){ return misfit(c).length===0; }

// ---------- state ----------
const state = {cat:"all", q:"", edition:"", carOnly:PROFILE.configured, view:"grid", sel:null, page:null,
               hvacBlower:null};
if(state.carOnly) document.getElementById("fcar").classList.add("on");
document.getElementById("stats").textContent =
  D.systems.length+" systems · "+CIRC.length+" circuits · "+D.sources.length+" editions";
if(location.protocol==="file:") document.getElementById("protowarn").style.display="block";
(function(){
  const sel=document.getElementById("fed");
  sel.innerHTML='<option value="">All editions</option>'+D.sources.map(s=>
    '<option value="'+esc(s.id)+'">'+esc(edLabel(s))+'</option>').join("");
})();

// ---------- helpers ----------
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function edLabel(s){ return (s.year||"Ref")+" · "+s.pub+(s.partial?" (partial)":""); }
function terms(){return state.q.toLowerCase().split(/\s+/).filter(Boolean);}
function hi(text){
  let out=esc(text);
  terms().forEach(w=>{
    const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    out=out.replace(re,"<mark>$1</mark>"); });
  return out;
}
function snippet(c){
  const t=terms(); if(!t.length) return "";
  const low=c.text.toLowerCase(); let i=-1;
  for(const w of t){const p=low.indexOf(w); if(p>=0&&(i<0||p<i))i=p;}
  if(i<0) return "";
  const s=Math.max(0,i-50), e=Math.min(c.text.length,i+90);
  return (s>0?"…":"")+hi(c.text.slice(s,e).replace(/\s+/g," "))+(e<c.text.length?"…":"");
}
function pageThumb(id,page){return "thumbs/pages/"+encodeURIComponent(id)+"_p"+page+".png";}
function viewerSrc(c,page){
  const abs=new URL(c.pdf,location.href).href;
  return "../shared/pdfjs/web/viewer.html?file="+encodeURIComponent(abs)+
         "#page="+(page||1)+"&zoom=page-width";
}
function blowerBadge(b){
  if(!b||!b.length) return "";
  return b.map(x=>'<span class="badge b-'+x.toLowerCase()+'">'+(x==="PUSH"?"PUSH-BUTTON":"DIAL")+'</span>').join("");
}
function edCircuits(sysKey){
  return SYS[sysKey].circuits.map(id=>BY_ID[id]).filter(c=>!state.edition||c.source===state.edition);
}
function matches(c){ return terms().every(w=>c._blob.includes(w)); }
function rankOf(c){ const t=terms(); return !t.length||t.every(w=>c._titleBlob.includes(w)) ? 0 : 1; }
// Best circuit of a system for the profile: fits first, then closest edition year.
function score(c){
  let s = fits(c) ? 1000 : 0;
  if(c.year) s -= Math.abs(c.year-PROFILE.year)*10;
  // same year: Toyota factory diagrams before partial pulls before aftermarket manuals
  if(SRC[c.source] && SRC[c.source].partial) s -= 1;
  if(SRC[c.source] && SRC[c.source].aftermarket) s -= 2;
  if(SRC[c.source] && SRC[c.source].reference) s -= 50;
  return s;
}
function bestOf(list){ return list.slice().sort((a,b)=>score(b)-score(a))[0]; }
function bestCircuit(sysKey){
  const list = edCircuits(sysKey);
  return bestOf(list.length?list:SYS[sysKey].circuits.map(id=>BY_ID[id]));
}
function openCircuit(id,page){
  if(!BY_ID[id]) return;
  state.sel=id; state.view="detail"; state.page=page||null; hidePv(); render();
}
function openSystem(key){ if(SYS[key]) openCircuit(bestCircuit(key).id); }

// ---------- hover preview ----------
const pv=document.getElementById("pv");
function hidePv(){pv.style.display="none";}
function movePv(e){
  const w=274,h=380; let x=e.clientX+18,y=e.clientY+14;
  if(x+w>innerWidth)x=e.clientX-w-18;
  if(y+h>innerHeight)y=Math.max(8,innerHeight-h-8);
  pv.style.left=x+"px"; pv.style.top=y+"px";
}
function bindPreviews(root){
  root.querySelectorAll("[data-pv]").forEach(el=>{
    el.addEventListener("mouseenter",e=>{
      const img=pv.querySelector("img");
      img.onerror=hidePv; img.src=el.dataset.pv;
      pv.querySelector(".cap").textContent=el.dataset.pvcap||"";
      pv.style.display="block"; movePv(e);
    });
    el.addEventListener("mousemove",movePv);
    el.addEventListener("mouseleave",hidePv);
  });
}
// link to a resolved location {circuit, page, printed}
function locLink(loc, label){
  if(!loc.circuit||!BY_ID[loc.circuit]) return '<span class="loclink" style="color:var(--muted);cursor:default">p.'+loc.printed+'</span>';
  const t=BY_ID[loc.circuit];
  return '<span class="loclink" data-open="'+esc(loc.circuit)+'" data-page="'+loc.page+'" '+
    'data-pv="'+pageThumb(loc.circuit,loc.page)+'" data-pvcap="'+esc(t.name+" — p."+loc.printed)+'">'+
    esc(label||("p."+loc.printed))+'</span>';
}

// ---------- rail ----------
function buildRail(){
  const counts={}; D.systems.forEach(s=>counts[s.category]=(counts[s.category]||0)+1);
  let h='<div class="railsec">Browse</div>'+railBtn("all","All systems",D.systems.length);
  D.categories.filter(c=>counts[c.key]).forEach(c=>{ h+=railBtn(c.key,c.name,counts[c.key]); });
  h+='<div class="railsec">Tools</div>'+
    '<button class="railbtn" data-view="locations"><span>📍 Locations index</span><span class="cnt">'+D.locations.length+'</span></button>'+
    '<button class="railbtn" data-view="profile"><span>🚗 My car</span></button>'+
    '<button class="railbtn" data-view="editions"><span>📚 Editions</span><span class="cnt">'+D.sources.length+'</span></button>'+
    '<button class="railbtn" data-view="add"><span>+ Add manuals</span></button>';
  const rail=document.getElementById("rail");
  rail.innerHTML=h;
  rail.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    state.cat=b.dataset.cat; state.view="grid"; state.sel=null; render(); });
  rail.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ state.view=b.dataset.view; render(); });
}
function railBtn(cat,label,count){
  return '<button class="railbtn" data-cat="'+esc(cat)+'"><span>'+esc(label)+'</span><span class="cnt">'+count+'</span></button>';
}
function syncRail(){
  document.querySelectorAll(".rail .railbtn").forEach(b=>{
    const on = b.dataset.view ? b.dataset.view===state.view
      : (state.view==="grid"||state.view==="detail") && b.dataset.cat===state.cat;
    b.classList.toggle("active",!!on);
  });
}

// ---------- render ----------
function render(){
  syncRail(); hidePv();
  const c=document.getElementById("content");
  const v=state.view;
  if(v==="detail" && BY_ID[state.sel]){
    const p=state.page; state.page=null;
    c.innerHTML=detailHTML(BY_ID[state.sel],p); wireDetail(c); return;
  }
  if(v==="locations"){ c.innerHTML=locationsHTML(); wireLocations(c); return; }
  if(v==="profile"){ c.innerHTML=profileHTML(); wireProfile(c); return; }
  if(v==="editions"){ c.innerHTML=editionsHTML(); wireGeneric(c); return; }
  if(v==="add"){ c.innerHTML=ADDP.html(); ADDP.wire(c); return; }
  state.view="grid";
  c.innerHTML=gridHTML(); wireGrid(c);
}

// ---------- grid (one card per system) ----------
function gridHTML(){
  const searching=terms().length>0;
  const cards=[];
  D.systems.forEach(s=>{
    if(state.cat!=="all" && s.category!==state.cat) return;
    let list=edCircuits(s.key);
    if(state.carOnly) list=list.filter(fits);
    if(searching) list=list.filter(matches);
    if(!list.length) return;
    const best=bestOf(list);
    cards.push({s, list, best, rank:Math.min(...list.map(rankOf))});
  });
  cards.sort((a,b)=>a.rank-b.rank || a.s.order-b.s.order);
  const title=state.cat==="all"?"All systems":CAT_NAME[state.cat];
  const sub=cards.length+" system"+(cards.length!==1?"s":"")+
    (state.carOnly?" that apply to your car":"")+
    (state.edition?" in "+edLabel(SRC[state.edition]):"")+
    (state.q?' matching “'+esc(state.q)+'”':'');
  let h='<div class="cbar"><span class="ttl">'+esc(title)+'</span><span class="sub">'+sub+'</span></div>'+
    '<div class="gridwrap">';
  if(!PROFILE.configured)
    h+='<div class="banner">🚗 <span>Tell the app about your car (year, A/C type, blower control, options) '+
       'and “My car” will hide circuits that don\'t apply.</span>'+
       '<button class="btn ghost" data-view="profile">Set up My car</button></div>';
  h+='<div class="grid">';
  if(searching){
    const locs=locationHits().slice(0,14);
    if(locs.length){
      h+='<div class="locstrip"><div class="lh">Component / connector locations</div>'+locs.map(l=>{
        const loc=l.loc.find(x=>x.circuit)||l.loc[0]||{};
        return '<span class="lochit" '+(loc.circuit?'data-open="'+esc(loc.circuit)+'" data-page="'+loc.page+'" '+
          'data-pv="'+pageThumb(loc.circuit,loc.page)+'" data-pvcap="'+esc(l.code+" — "+l.name)+'"':'')+'>'+
          '<span class="code">'+esc(l.code)+'</span>'+hi(l.name)+
          '<span class="src">'+esc((SRC[l.source]||{}).year||l.source)+(loc.printed?" p."+loc.printed:"")+'</span></span>';
      }).join("")+'</div>';
    }
  }
  if(!cards.length){
    h+='</div><div class="empty">No systems match. Try clearing the search, the edition filter or “My car”.</div></div>';
    return h;
  }
  let lastRank=-1;
  cards.forEach(({s,list,best,rank})=>{
    if(searching && rank!==lastRank){
      h+='<div class="divider">'+(rank===0?"Title / feature matches":"Component & content matches")+'</div>';
      lastRank=rank;
    }
    const years=[...new Set(list.map(c=>c.year).filter(Boolean))].sort();
    const variants=new Set(list.map(c=>c.source+"|"+c.variant)).size;
    const blowers=[...new Set([].concat(...list.map(c=>(c.applies.blower||[]))))];
    h+='<div class="gcard" data-sys="'+esc(s.key)+'" data-id="'+esc(best.id)+'">'+
      '<div class="gthumb"><img loading="lazy" src="'+esc(best.thumb)+'" alt="" '+
        'onerror="this.style.display=\'none\'">'+
        '<div class="bstack">'+
          (PROFILE.configured&&list.some(fits)?'<span class="badge b-fit">MY CAR ✓</span>':'')+
          (s.category==="hvac"?blowerBadge(blowers):'')+
          (variants>years.length?'<span class="badge b-var">'+variants+' VARIANTS</span>':'')+
        '</div></div>'+
      '<div class="gmeta"><div class="gtitle">'+hi(s.name)+'</div>'+
        '<div class="gsub">'+esc(CAT_NAME[s.category])+' · '+best.features.length+' feature'+
          (best.features.length!==1?'s':'')+' · '+best.components.length+' parts</div>'+
        '<div class="gyears">'+years.map(y=>'<span class="badge b-yr">'+y+'</span>').join("")+'</div>'+
        (searching&&rank===1&&snippet(best)?'<div class="gsnip">'+snippet(list.find(matches)||best)+'</div>':'')+
      '</div></div>';
  });
  return h+'</div></div>';
}
function locationHits(){
  const t=terms(); if(!t.length) return [];
  const q=state.q.trim().toUpperCase().replace(/\s+/g,"");
  return D.locations.filter(l=>(!state.edition||l.source===state.edition) &&
      (l.code.toUpperCase()===q || t.every(w=>(l.code+" "+l.name).toLowerCase().includes(w))))
    .sort((a,b)=>(b.code.toUpperCase()===q)-(a.code.toUpperCase()===q) ||
      ((SRC[b.source]||{}).year||0)-((SRC[a.source]||{}).year||0));
}
function wireGrid(c){
  c.querySelectorAll(".gcard").forEach(el=>el.onclick=()=>openCircuit(el.dataset.id));
  wireGeneric(c);
}
function wireGeneric(c){
  c.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{
    e.stopPropagation();

// ---------- detail ----------
function applyBadges(c){
  const a=c.applies||{}, out=[];
  if(c.year) out.push('<span class="badge b-yr">'+c.year+'</span>');
  (a.engines||[]).forEach(e=>out.push('<span class="badge b-code">'+e+'</span>'));
  (a.drive||[]).forEach(e=>out.push('<span class="badge b-code">'+(e==="2WD"?"2WD":"All-Trac/4WD")+'</span>'));
  (a.market||[]).forEach(e=>out.push('<span class="badge b-code">'+e+'</span>'));
  (a.trans||[]).forEach(e=>out.push('<span class="badge b-code">'+e+' only</span>'));
  (a.body||[]).forEach(e=>out.push('<span class="badge b-code">'+e.toLowerCase()+'</span>'));
  (a.ac||[]).forEach(e=>out.push('<span class="badge b-code">'+({AUTO:"Automatic A/C",MANUAL:"Manual A/C",NONE:"No A/C"}[e])+'</span>'));
  out.push(blowerBadge(a.blower));
  return out.join("");
}
function detailHTML(c, jumpPage){
  const sys=SYS[c.system], src=SRC[c.source]||{};
  // editions of this system, and variants within the current edition
  const all=sys.circuits.map(id=>BY_ID[id]);
  const eds=[...new Set(all.map(x=>x.source))].sort((a,b)=>((SRC[a]||{}).year||0)-((SRC[b]||{}).year||0));
  const edChips=eds.map(sid=>{
    const s=SRC[sid]||{id:sid};
    const target=bestOf(all.filter(x=>x.source===sid));
    return '<span class="chip'+(sid===c.source?' on':'')+'" data-open="'+esc(target.id)+'">'+
      esc(s.year||"Ref")+'<span class="yr">'+esc(s.pub||"")+(s.partial?" · partial":"")+'</span></span>';
  }).join("");
  const sib=all.filter(x=>x.source===c.source);
  const varChips=sib.length>1?sib.map(x=>
    '<span class="chip'+(x.id===c.id?' on':'')+'" data-open="'+esc(x.id)+'" title="'+esc(x.title)+'">'+
      esc(x.variant||"Base")+(PROFILE.configured&&fits(x)?' ✓':'')+'</span>').join(""):"";
  const why=misfit(c);
  const fitLine=!PROFILE.configured?'':
    why.length?'<div class="fitnote no">✗ Not for your car: '+esc(why.join(", "))+'</div>'
              :'<div class="fitnote ok">✓ Applies to your car ('+esc(PROFILE.year+" "+PROFILE.model)+')</div>';

  let info="";
  if(c.category==="hvac") info+=hvacCard(c);
  info+=featuresCard(c);
  info+=componentsCard(c);
  info+=powerCard(c);
  info+=refsCard(c);
  info+=repairCard(sys);
  if(c.options.length)
    info+='<div class="card"><h3>Option notes on these pages</h3><div class="inner"><div class="chips">'+
      c.options.map(o=>'<span class="badge b-code">'+esc(o.replace(/^W\/O /,"w/o ").replace(/^W\/ /,"w/ "))+'</span>').join("")+
      '</div><p class="hint" style="margin:8px 0 0">Equipment the diagram marks with “w/” or “w/o” — wiring that only exists on some cars.</p></div></div>';

  return '<div class="detail">'+
    '<div class="dtop"><div class="row1">'+
      '<button class="btn ghost" id="back">← Systems</button>'+
      '<h2>'+esc(sys.name)+(c.variant?' — '+esc(c.variant):'')+'</h2>'+
      '<a class="btn" href="'+viewerSrc(c,jumpPage)+'" target="_blank" rel="noopener">Open in new tab ↗</a>'+
    '</div>'+
    '<div class="drow"><div class="chips"><span class="lbl">Edition</span>'+edChips+'</div>'+
      (varChips?'<div class="chips"><span class="lbl">Variant</span>'+varChips+'</div>':'')+'</div>'+
    '<div class="dmeta">'+applyBadges(c)+
      '<span>'+c.pages+' page'+(c.pages!==1?'s':'')+(c.printed?' · manual p.'+c.printed[0]+(c.printed[1]!==c.printed[0]?'–'+c.printed[1]:''):'')+'</span>'+
      '<span style="color:#63707d">'+esc(src.title||c.source)+' · '+esc(c.file)+'</span></div>'+
    fitLine+
    '</div>'+
    '<div class="dsplit">'+
      '<div class="pdfpane"><iframe id="viewer" src="'+viewerSrc(c,jumpPage)+'" title="'+esc(sys.name)+' PDF"></iframe></div>'+
      '<div class="infopane">'+info+'</div>'+

}
function featuresCard(c){
  const sel=c.category==="hvac" ? (state.hvacBlower||profBlower()).toUpperCase() : "";
  let h='<div class="card"><h3>System outline — features ('+c.features.length+')</h3><div class="inner">';
  if(!c.features.length){
    h+='<p class="hint" style="margin:0">This circuit has no numbered system-outline section. '+
       'Use the page tags and components below to navigate it.</p>';
  } else {
    h+='<p class="hint">Each feature the manual describes for this circuit — click to jump to its explanation.</p>';
    c.features.forEach(f=>{
      const dim = sel && f.blower.length && !f.blower.includes(sel);
      h+='<div class="feat'+(dim?' dim':'')+'" data-goto="'+f.page+'">'+
        '<span class="n">'+f.n+'.</span><span class="t">'+esc(f.title)+' '+blowerBadge(f.blower)+'</span>'+
        '<span class="pg">p.'+f.page+'</span></div>';
    });
  }
  const tags=Object.entries(c.page_tags||{});
  if(tags.length){
    h+='<p class="hint" style="margin:10px 0 6px">Pages that only apply to one variant:</p>';
    tags.forEach(([pg,t])=>{
      h+='<div class="feat" data-goto="'+pg+'"><span class="n">▸</span><span class="t">'+esc(t.label)+' '+
        blowerBadge(t.blower)+'</span><span class="pg">p.'+pg+'</span></div>';
    });
  }
  return h+'</div></div>';
}
function componentsCard(c){
  if(!c.components.length) return "";
  let h='<div class="card"><h3>Components ('+c.components.length+')</h3><div class="inner">'+
    '<p class="hint">Part codes from the diagram’s parts-location table. Click a page to see where the part sits; hover to preview.</p>'+
    (c.components.length>10?'<input class="mini" id="cfilter" placeholder="Filter components…">':'')+
    '<table class="ctable" id="ctable">';
  c.components.forEach(x=>{
    h+='<tr data-f="'+esc((x.code+" "+x.name).toLowerCase())+'"><td class="code">'+esc(x.code)+'</td>'+
      '<td>'+esc(x.name||"—")+(x.spec.includes("(")?'<div class="hint" style="margin:0">'+esc(x.spec)+'</div>':'')+'</td>'+
      '<td class="where">'+x.loc.map(l=>locLink(l)).join("")+'</td></tr>';
  });
  return h+'</table></div></div>';
}
function powerCard(c){
  const rows=[].concat(
    c.relay_blocks.map(x=>({k:"Relay block",x})),
    c.junction_blocks.map(x=>({k:"J/B connector",x})),
    c.joints.map(x=>({k:"Harness joint",x})));
  if(!c.fuses.length && !rows.length) return "";
  const ps = CIRC.find(x=>x.source===c.source && x.system==="power-source");
  let h='<div class="card"><h3>Fuses, relay blocks &amp; connectors</h3><div class="inner">';
  if(c.fuses.length){
    h+='<div class="chips" style="margin-bottom:8px">'+c.fuses.map(f=>
      '<span class="badge b-code" style="font-size:11px">'+esc(f)+'</span>').join("")+'</div>';
    if(ps) h+='<p class="hint">Fuse feeds are drawn in '+locLink({circuit:ps.id,page:1,printed:(ps.printed||[1])[0]},"Power Source")+
      ' for this edition.</p>';
  }
  if(rows.length){
    h+='<table class="ctable">';
    rows.forEach(({k,x})=>{
      h+='<tr><td class="code">'+esc(x.code)+'</td><td>'+esc(x.name)+'<div class="hint" style="margin:0">'+k+'</div></td>'+
        '<td class="where">'+x.loc.map(l=>locLink(l)).join("")+'</td></tr>';
    });

function refsCard(c){
  if(!c.refs.length) return "";
  return '<div class="card"><h3>Jump links — “see page”</h3><div class="inner">'+
    '<p class="hint">Pages this circuit refers to. Hover to preview, click to open.</p><div class="reflist">'+
    c.refs.map(r=>{
      const t=BY_ID[r.circuit];
      return '<span class="refbtn" data-open="'+esc(r.circuit)+'" data-page="'+r.page+'" '+
        'data-pv="'+pageThumb(r.circuit,r.page)+'" data-pvcap="'+esc(t.name+" — p."+r.printed)+'">'+
        esc(t.name)+'<span class="pg">p.'+r.printed+'</span></span>';

function repairCard(sys){
  if(!sys.repair||!sys.repair.length) return "";
  return '<div class="card"><h3>Repair manual</h3><div class="inner">'+
    '<p class="hint">Related procedures and bulletins in the repair-manual app.</p>'+

// A/C breakdown: Automatic vs Manual x Push-button vs Dial blower control,
// and which edition covers each combination.
function hvacCard(c){
  const acKeys=[["hvac-auto","Automatic"],["hvac-manual","Manual"]].filter(([k])=>SYS[k]);
  const curAc=c.system, curBl=(state.hvacBlower||((c.applies.blower||[])[0])||profBlower()||"").toUpperCase();
  let h='<div class="card"><h3>A/C control type</h3><div class="inner">'+
    '<p class="hint">Toyota changed the climate controls during the ST18x run: 1990–91 cars use five push buttons '+
    'for the blower, 1992–93 cars a single dial. Pick your controls to get the matching diagram.</p>';
  h+='<div class="seg">'+acKeys.map(([k,l])=>'<button data-hvac-ac="'+k+'" class="'+(k===curAc?'on':'')+'">'+l+' A/C</button>').join("")+'</div>';
  h+='<div class="seg">'+[["PUSH","Push-button blower"],["DIAL","Dial blower"]].map(([b,l])=>
    '<button data-hvac-bl="'+b+'" class="'+(b===curBl?'on':'')+'">'+l+'</button>').join("")+'</div>';
  // coverage matrix
  const eds=D.sources.filter(s=>CIRC.some(x=>x.source===s.id && x.category==="hvac"));
  h+='<table class="matrix"><tr><th></th>'+eds.map(s=>'<th title="'+esc(s.title)+'">'+esc(s.year||s.pub)+
    (s.aftermarket?'<br><span style="font-weight:400">Mitchell</span>':s.partial?'<br><span style="font-weight:400">TIS</span>':'')+
    '</th>').join("")+'</tr>';
  acKeys.forEach(([k,l])=>{
    [["PUSH","push"],["DIAL","dial"]].forEach(([b,bl])=>{
      h+='<tr><th>'+l+' · '+bl+'</th>'+eds.map(s=>{
        const hit=CIRC.find(x=>x.source===s.id && x.system===k && (x.applies.blower||[]).includes(b));
        if(!hit) return '<td class="miss">—</td>';
        return '<td class="hit'+(hit.id===c.id&&b===curBl?' cur':'')+'" data-open="'+esc(hit.id)+'" data-bl="'+b+'" '+
          'title="'+esc(hit.title)+'">✓'+(hit.printed?' p.'+hit.printed[0]:'')+'</td>';
      }).join("")+'</tr>';
    });
  });
  h+='</table>';
  const note = curBl && !(c.applies.blower||[]).includes(curBl)
    ? '<p class="note" style="margin-top:8px">This edition’s diagram does not cover the '+(curBl==="PUSH"?"push-button":"dial")+
      ' blower control — pick a ✓ cell above.</p>' : '';
  // other circuits of this edition whose wiring changes with the blower control
  const others=CIRC.filter(x=>x.source===c.source && x.category!=="hvac" &&
    Object.values(x.page_tags||{}).some(t=>t.blower&&t.blower.length));
  const more = others.length ? '<p class="hint" style="margin:10px 0 4px">Other '+esc((SRC[c.source]||{}).year||"")+
    ' circuits with blower-dependent wiring:</p>'+others.map(x=>{
      const pg=Object.entries(x.page_tags).find(([,t])=>t.blower&&t.blower.length)[0];
      return '<span class="xlink" data-open="'+esc(x.id)+'" data-page="'+pg+'">'+esc(x.name+(x.variant?" — "+x.variant:""))+
        ' <span class="loclink">p.'+pg+'</span></span>';
    }).join("") : '';
  return h+note+more+'</div></div>';
}
function hvacPick(acKey, blower){
  const list=CIRC.filter(x=>x.system===acKey && (!blower||(x.applies.blower||[]).includes(blower)));
  if(!list.length) return null;
  return bestOf(list);
}

function wireDetail(c){
  c.querySelector("#back").onclick=()=>{state.view="grid";state.sel=null;render();};
  const viewer=c.querySelector("#viewer");
  const cur=BY_ID[state.sel];
  c.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>{
    viewer.src=viewerSrc(cur, parseInt(el.dataset.goto,10));
  });
  c.querySelectorAll("[data-bl]").forEach(el=>el.addEventListener("click",()=>{state.hvacBlower=el.dataset.bl;},true));
  c.querySelectorAll("[data-hvac-ac]").forEach(el=>el.onclick=()=>{
    const pick=hvacPick(el.dataset.hvacAc, state.hvacBlower||((cur.applies.blower||[])[0]))||hvacPick(el.dataset.hvacAc);
    if(pick) openCircuit(pick.id);
  });
  c.querySelectorAll("[data-hvac-bl]").forEach(el=>el.onclick=()=>{
    state.hvacBlower=el.dataset.hvacBl;
    const pick=(cur.applies.blower||[]).includes(state.hvacBlower) ? cur : hvacPick(cur.system, state.hvacBlower);
    openCircuit((pick||cur).id);
  });
  const cf=c.querySelector("#cfilter");
  if(cf) cf.oninput=()=>{
    const q=cf.value.toLowerCase().trim();
    c.querySelectorAll("#ctable tr").forEach(tr=>tr.style.display=!q||tr.dataset.f.includes(q)?"":"none");
  };
  wireGeneric(c);
}

function drawLocations(){
  const body=document.getElementById("lbody"); if(!body) return;

  const rows=D.locations.filter(l=>(!LOC.kind||l.kind===LOC.kind)&&(!LOC.edition||l.source===LOC.edition)&&
    t.every(w=>(l.code+" "+l.name).toLowerCase().includes(w)));
  const shown=rows.slice(0,400);
  body.innerHTML=!rows.length?'<div class="empty">No locations match.</div>':
    '<table class="loctable"><tr><th>Code</th><th>Name</th><th>Kind</th><th>Edition</th><th>Location page</th></tr>'+
    shown.map(l=>'<tr><td class="code">'+esc(l.code)+'</td><td>'+esc(l.name)+'</td><td>'+KIND_NAME[l.kind]+'</td>'+

    '</table>'+(rows.length>shown.length?'<p class="hint" style="margin:10px 0">Showing 400 of '+rows.length+' — refine the search.</p>':'');
  wireGeneric(body);
}
function wireLocations(c){
  const lq=c.querySelector("#lq");
  lq.oninput=()=>{LOC.q=lq.value; drawLocations();};
  c.querySelector("#lk").onchange=e=>{LOC.kind=e.target.value; drawLocations();};
  c.querySelector("#le").onchange=e=>{LOC.edition=e.target.value; drawLocations();};
  drawLocations(); lq.focus();
}

  if(state.view!=="grid") state.view="grid"; render();};
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); document.getElementById("q").focus(); }
  if(e.key==="Escape"&&state.view==="detail"){state.view="grid";state.sel=null;render();}
});

buildRail();
render();
Shell.onOpen((id,page)=>{
  if(id.startsWith("sys:")) openSystem(id.slice(4));
  else openCircuit(id,page);
});
</script>
</body>
