<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>ST185 Celica — Workshop Library</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  body{display:flex;flex-direction:column;overflow:hidden}
  .shellbar{display:flex;align-items:center;gap:14px;padding:0 16px;height:44px;flex:0 0 auto;
    background:linear-gradient(180deg,#12181f,#0d1117);border-bottom:1px solid var(--line)}
  .shellbar h1{font-size:15px;margin:0;letter-spacing:.3px;white-space:nowrap}
  .shellbar h1 .car{color:var(--accent);font-weight:700}
  .tabs{display:flex;gap:4px;height:100%;align-items:flex-end}
  .tab{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--muted);
    padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--txt);background:var(--panel)}
  .tab.active{color:var(--txt);background:var(--panel2);border-color:var(--line);
    box-shadow:inset 0 3px 0 var(--tabc,var(--blue))}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--tabc,var(--blue))}
  .tab[data-app="repair"]{--tabc:var(--accent)}
  .tab[data-app="electrical"]{--tabc:var(--amber)}
  .kbdhint{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .frames{flex:1;position:relative;min-height:0}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  .frames iframe.active{display:block}
  #protowarn{display:none;background:#3a2b10;color:#ffd88a;border-bottom:1px solid #5a451c;
    padding:8px 16px;font-size:13px}
  @media(max-width:760px){.kbdhint{display:none}.shellbar h1 .full{display:none}}
</style>
</head>
<body>
<div class="shellbar">
  <h1>🔧 ST185 Celica <span class="car">GT-Four / All-Trac</span><span class="full"> — Workshop Library</span></h1>
  <nav class="tabs" id="tabs">
    <button class="tab" data-app="repair" title="Factory repair manual (Ctrl+1)"><span class="dot"></span>Repair Manual</button>
    <button class="tab" data-app="electrical" title="Electrical wiring diagrams (Ctrl+2)"><span class="dot"></span>Electrical</button>
  </nav>
  <span class="kbdhint">Ctrl+1 / Ctrl+2 to switch</span>
</div>
<div id="protowarn">⚠ Opened as a plain file — the in-app PDF viewer needs the local server.
  Run <b>CelicaManual.exe</b> instead.</div>
<div class="frames" id="frames"></div>
<script>
"use strict";
const APPS = {
  repair:     {src:"celica-manual/index.html", title:"Repair Manual"},
  electrical: {src:"electrical/index.html",    title:"Electrical"},
};
const frames = {};          // app -> {el, ready, queue}
let current = null;

if(location.protocol==="file:") document.getElementById("protowarn").style.display="block";

// Iframes are created on first use and never destroyed, so each app keeps its
// own state (search, open section, scroll) while the other tab is showing.
function frameFor(app){
  if(frames[app]) return frames[app];
  const el = document.createElement("iframe");
  el.title = APPS[app].title;
  const f = {el:el, ready:false, queue:[]};
  el.addEventListener("load",()=>{
    f.ready = true;
    f.queue.splice(0).forEach(m=>el.contentWindow.postMessage(m, location.origin));
  });
  el.src = APPS[app].src;
  document.getElementById("frames").appendChild(el);
  frames[app] = f;
  return f;
}
function send(app, msg){
  const f = frameFor(app);
  if(f.ready) f.el.contentWindow.postMessage(msg, location.origin);
  else f.queue.push(msg);
}
function show(app){
  if(!APPS[app]) app = "repair";
  current = app;
  const f = frameFor(app);
  Object.entries(frames).forEach(([k,v])=>v.el.classList.toggle("active", k===app));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.app===app));
  document.title = "ST185 Celica — "+APPS[app].title;
  try{ localStorage.setItem("shell.app", app); }catch(e){}
  if(f.ready) f.el.contentWindow.focus();
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.app));
window.addEventListener("message", e=>{
  if(e.origin!==location.origin || !e.data) return;
  if(e.data.type==="open" && APPS[e.data.app]){
    show(e.data.app);
    send(e.data.app, {type:"open", id:e.data.id, page:e.data.page||null});
  } else if(e.data.type==="switch" && APPS[e.data.app]){
    show(e.data.app);
  }
});
function keySwitch(e){
  if(!(e.ctrlKey||e.metaKey)) return;
  if(e.key==="1"){ e.preventDefault(); show("repair"); }
  if(e.key==="2"){ e.preventDefault(); show("electrical"); }
}
document.addEventListener("keydown", keySwitch);
// Child frames forward Ctrl+1/2 here (keyboard focus is usually inside one).
window.addEventListener("message", e=>{
  if(e.origin===location.origin && e.data && e.data.type==="key") keySwitch(
    {ctrlKey:true, key:e.data.key, preventDefault(){}});
});

let start = "repair";
const m = /app=(\w+)/.exec(location.hash);
try{ start = (m && m[1]) || localStorage.getItem("shell.app") || "repair"; }catch(e){}
show(start);
</script>
</body>
</html>
